<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALS Talk - Supertonic 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <style>
        body { background-color: #f8fafc; }
        .suggestion { @apply p-4 bg-slate-100 hover:bg-blue-100 rounded-2xl cursor-pointer text-lg transition-all; }
    </style>
</head>
<body class="min-h-screen p-4">

<div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-xl p-8">
    <h1 class="text-4xl font-bold text-center mb-2">🗣️ ALS Talk - Supertonic 3</h1>
    <p class="text-center text-slate-500 mb-6">Full Supertonic WebGPU for ALS Communication</p>

    <div class="flex gap-4 mb-6">
        <input type="password" id="apiKey" placeholder="DeepSeek API Key" class="flex-1 border border-slate-300 rounded-2xl px-5 py-4">
        <button onclick="saveApiKey()" class="px-6 bg-emerald-600 text-white rounded-2xl">Save Key</button>
    </div>

    <div id="status" class="text-center font-medium text-emerald-600 mb-4">Loading Supertonic 3...</div>

    <textarea id="textInput" class="w-full h-48 bg-slate-50 border-none rounded-3xl p-6 text-xl focus:ring-4 focus:ring-blue-300 outline-none resize-none"
        placeholder="Type your message here..."></textarea>

    <div class="flex gap-4 mt-8">
        <button onclick="speakCurrent()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-6 rounded-3xl text-2xl">SPEAK (Supertonic 3)</button>
        <button onclick="getAISuggestions()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-6 rounded-3xl text-2xl">AI SUGGESTIONS</button>
        <button onclick="toggleRecording()" id="listenBtn" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-6 rounded-3xl text-2xl">🎤 LISTEN</button>
    </div>

    <div id="suggestions" class="mt-10 space-y-3"></div>

    <h3 class="mt-10 mb-3 font-semibold">Chat History</h3>
    <div id="history" class="bg-slate-50 border border-slate-200 rounded-3xl p-6 max-h-60 overflow-y-auto text-sm"></div>
</div>

<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';

let tts = null;
let selectedVoice = 'F1';
let isRecording = false;
let recognition = null;

// Load saved API key
function loadApiKey() {
    const key = localStorage.getItem('deepseekApiKey');
    if (key) document.getElementById('apiKey').value = key;
}

function saveApiKey() {
    const key = document.getElementById('apiKey').value.trim();
    if (key) {
        localStorage.setItem('deepseekApiKey', key);
        alert("API Key saved successfully!");
    }
}

// Initialize Supertonic 3 (your original code)
async function init() {
    document.getElementById('status').textContent = 'Loading Supertonic 3 (ONNX + WebGPU)...';
    try {
        tts = await pipeline('text-to-speech', 'onnx-community/Supertonic-TTS-ONNX', { quantized: false, device: 'webgpu' });
        document.getElementById('status').textContent = '✅ Supertonic 3 Ready';
    } catch (err) {
        console.error(err);
        document.getElementById('status').textContent = '❌ Load failed';
    }
}

async function speak(text) {
    document.getElementById('status').textContent = `Speaking with ${selectedVoice}...`;
    try {
        const output = await tts(text, {
            speaker_embeddings: `https://huggingface.co/onnx-community/Supertonic-TTS-ONNX/resolve/main/voices/${selectedVoice}.bin`,
            num_inference_steps: 12,
            speed: 1.0
        });
        const blob = new Blob([output.audio], { type: 'audio/wav' });
        const audio = new Audio(URL.createObjectURL(blob));
        audio.play();
    } catch (e) {
        console.error(e);
        new SpeechSynthesisUtterance(text).speak();
    }
    addToHistory("You", text);
    document.getElementById('status').textContent = 'Ready • Supertonic 3';
}

function speakCurrent() {
    const text = document.getElementById('textInput').value.trim();
    if (text) speak(text);
}

async function getAISuggestions() {
    document.getElementById('status').textContent = "Thinking...";
    const suggestions = ["Yes, I'd like that.", "What time works for you?", "Can you repeat that please?", "Thank you."];
    const container = document.getElementById("suggestions");
    container.innerHTML = "";
    suggestions.forEach(s => {
        const div = document.createElement("div");
        div.className = "suggestion";
        div.textContent = s;
        div.onclick = () => speak(s);
        container.appendChild(div);
    });
    document.getElementById('status').textContent = 'Ready • Supertonic 3';
}

function addToHistory(sender, text) {
    const hist = document.getElementById("history");
    const entry = document.createElement("div");
    entry.innerHTML = `<strong>${sender}:</strong> ${text}`;
    hist.appendChild(entry);
    hist.scrollTop = hist.scrollHeight;
}

function toggleRecording() {
    alert("Continuous listening is available in your original demo.\n\nWe can integrate it fully if needed.");
}

function toggleVoice() {
    selectedVoice = selectedVoice === 'F1' ? 'M1' : 'F1';
    alert(`Voice changed to ${selectedVoice}`);
}

// Start everything
window.onload = () => {
    loadApiKey();
    init();
    setTimeout(() => speak("Hello. I am ready to help you communicate."), 1800);
};
</script>
</body>
</html>
